name: Daily Actions artifact cleanup
on:
  schedule:
    - cron: '17 3 * * *' # daily at 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Remove superseded artifacts and keep two latest per category
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, time
          from collections import defaultdict
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          base=f'https://api.github.com/repos/{repo}/actions/artifacts'
          headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'actions-storage-cleanup'}
          def api(method,url):
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=45) as response:
                  return response.read()
          artifacts=[]
          page=1
          while True:
              data=json.loads(api('GET',f'{base}?per_page=100&page={page}'))
              chunk=data.get('artifacts',[])
              artifacts.extend(chunk)
              if len(chunk)<100: break
              page+=1
          def category(name):
              s=name.lower()
              if 'source' in s: return 'source'
              if 'backup' in s: return 'backup'
              if 'pages' in s: return 'pages'
              if 'debug' in s: return 'debug-apk'
              if 'play' in s or 'aab' in s: return 'play-aab'
              if 'release' in s: return 'release'
              if 'test' in s: return 'test-apk'
              if 'apk' in s: return 'apk'
              return 'other:'+name
          groups=defaultdict(list)
          for artifact in artifacts:
              if not artifact.get('expired'):
                  groups[category(artifact['name'])].append(artifact)
          remove=[]
          kept=[]
          for kind,items in groups.items():
              items.sort(key=lambda x:(x['created_at'],x['id']),reverse=True)
              kept.extend(items[:2])
              remove.extend(items[2:])
              print(f'{kind}: {len(items)} found, {min(2,len(items))} preserved')
          deleted=0
          bytes_freed=0
          for a in remove:
              try:
                  api('DELETE',f'{base}/{a["id"]}')
                  deleted+=1
                  bytes_freed+=a.get('size_in_bytes',0)
                  if deleted%25==0:
                      print(f'Deleted {deleted}/{len(remove)}, {bytes_freed/1048576:.1f} MiB')
                  time.sleep(0.35)
              except urllib.error.HTTPError as exc:
                  if exc.code==404: continue
                  print(f'ERROR deleting artifact id={a["id"]}: HTTP {exc.code}')
                  raise
          print(f'FINISHED: deleted={deleted}, freed_MiB={bytes_freed/1048576:.2f}, preserved={len(kept)}')
          PY
