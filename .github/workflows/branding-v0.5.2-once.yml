name: Apply branding v0.5.2 once

on:
  push:
    branches:
      - 'branding-v0.5.2-trigger'

permissions:
  contents: write

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Kacper & Kapi The Game branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Central full brand name; short launcher name intentionally stays Kacper & Kapi.
          replace_once(
              'app/src/main/res/values/strings.xml',
              '    <string name="app_name">Kacper &amp; Kapi</string>\n',
              '    <string name="app_name">Kacper &amp; Kapi</string>\n    <string name="brand_full_name">Kacper &amp; Kapi: The Game</string>\n'
          )

          # Splash + diagnostic branding.
          replace_once(
              'app/src/main/java/pl/kacperikapi/mathadventure/MainActivity.kt',
              'text = "Kacper i Kapi – diagnostyka',
              'text = "Kacper & Kapi: The Game – diagnostyka'
          )
          replace_once(
              'app/src/main/java/pl/kacperikapi/mathadventure/MainActivity.kt',
              'Text("KACPER i KAPI", fontSize = 34.sp',
              'Text(stringResource(R.string.brand_full_name), fontSize = 32.sp'
          )

          # Main in-app title; reduce font a little so the longer name fits phones.
          replace_once(
              'app/src/main/java/pl/kacperikapi/mathadventure/ui/components/GameChrome.kt',
              'text = "KACPER i KAPI"',
              'text = stringResource(R.string.brand_full_name)'
          )
          replace_once(
              'app/src/main/java/pl/kacperikapi/mathadventure/ui/components/GameChrome.kt',
              'fontSize = if (compact) 25.sp else 32.sp,',
              'fontSize = if (compact) 20.sp else 27.sp,'
          )

          # Version for the next distributable build.
          replace_once('app/build.gradle.kts', 'versionCode = 19', 'versionCode = 20')
          replace_once('app/build.gradle.kts', 'versionName = "0.5.1"', 'versionName = "0.5.2"')
          Path('VERSION.txt').write_text('0.5.2\n', encoding='utf-8')

          # Future GitHub release names use the new brand.
          replace_once(
              '.github/workflows/release.yml',
              '--title "Kacper i Kapi $RELEASE_TAG"',
              '--title "Kacper & Kapi: The Game $RELEASE_TAG"'
          )

          Path('CHANGELOG_0.5.2.md').write_text(
              '# Kacper & Kapi: The Game — 0.5.2\n\n'
              '- Nowa pełna nazwa marki: **Kacper & Kapi: The Game**.\n'
              '- Pełna nazwa jest używana na ekranie startowym i w głównym nagłówku gry.\n'
              '- Krótka nazwa pod ikoną pozostaje **Kacper & Kapi**, aby dobrze mieściła się na ekranie telefonu.\n'
              '- Nazwa przyszłych wydań GitHub została ujednolicona z nowym brandingiem.\n'
              '- Wersja Android: `0.5.2` (`versionCode 20`).\n',
              encoding='utf-8'
          )

          # Remove this one-time workflow in the same branding commit.
          Path('.github/workflows/branding-v0.5.2-once.yml').unlink()
          PY

      - name: Commit branding to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Brand app as Kacper & Kapi: The Game v0.5.2"
          git push origin HEAD:main
