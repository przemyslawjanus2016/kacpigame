name: Build Google Play AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kacperkapi-release.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kacperkapi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean bundleRelease

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION.txt)"
          test -n "$VERSION" || { echo "VERSION.txt is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Play bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p dist
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB_PATH" || { echo "Release AAB not found"; exit 1; }
          cp "$AAB_PATH" "dist/KacperKapi-Play-v$APP_VERSION.aab"
          jarsigner -verify "dist/KacperKapi-Play-v$APP_VERSION.aab"

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: KacperKapi-Play-v${{ steps.app_version.outputs.version }}
          path: dist/KacperKapi-Play-v${{ steps.app_version.outputs.version }}.aab
          if-no-files-found: error
          retention-days: 14
