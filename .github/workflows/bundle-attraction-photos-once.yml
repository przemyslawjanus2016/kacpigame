name: Bundle attraction photos once

on:
  push:
    branches:
      - foundation-v0.5.3

permissions:
  contents: write

jobs:
  bundle:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation-v0.5.3
          fetch-depth: 0

      - name: Download curated Commons photos into the app
        shell: bash
        run: |
          test -f .bundle_photos_pending || exit 0
          python3 - <<'PY'
          from pathlib import Path
          import re, json, urllib.parse, urllib.request, html, time

          SOURCE = Path('app/src/main/java/pl/kacperikapi/mathadventure/data/AttractionContent.kt')
          OUT = Path('app/src/main/res/drawable-nodpi')
          ASSETS = Path('app/src/main/assets')
          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          USER_AGENT = 'KacperKapiTheGame/0.5.3 (educational Android app; bundled Wikimedia Commons media)'

          text = SOURCE.read_text(encoding='utf-8')
          block_re = re.compile(r'^\s*(item|searchItem)\(\s*\n(.*?)^\s*\),', re.M | re.S)
          str_re = re.compile(r'"((?:\\.|[^"\\])*)"')
          cards = []
          for kind, body in block_re.findall(text):
              args = str_re.findall(body)
              if kind == 'item' and len(args) >= 8:
                  cards.append((kind, args[0], args[5]))
              elif kind == 'searchItem' and len(args) >= 6:
                  cards.append((kind, args[0], args[5]))

          if len(cards) < 60:
              raise SystemExit(f'Expected at least 60 attraction cards, parsed only {len(cards)}')

          def fetch_json(params):
              url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=35) as r:
                  return json.loads(r.read().decode('utf-8'))

          def clean(value):
              value = re.sub(r'<[^>]+>', ' ', value or '')
              return re.sub(r'\s+', ' ', html.unescape(value)).strip()

          def from_page(page):
              info = (page.get('imageinfo') or [None])[0]
              if not info:
                  return None
              url = info.get('thumburl') or info.get('url')
              if not url:
                  return None
              meta = info.get('extmetadata') or {}
              author = clean((meta.get('Artist') or {}).get('value')) or 'Wikimedia Commons contributor'
              license_name = clean((meta.get('LicenseShortName') or {}).get('value')) or 'see source'
              source = info.get('descriptionurl') or 'https://commons.wikimedia.org/'
              return url, author, license_name, source

          def resolve_exact(filename):
              data = fetch_json({
                  'action':'query','titles':'File:' + filename,'prop':'imageinfo',
                  'iiprop':'url|extmetadata','iiurlwidth':'960','format':'json','formatversion':'2'
              })
              for page in data.get('query', {}).get('pages', []):
                  found = from_page(page)
                  if found:
                      return found
              return None

          def resolve_search(query):
              data = fetch_json({
                  'action':'query','generator':'search','gsrsearch':query,'gsrnamespace':'6','gsrlimit':'8',
                  'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'960','format':'json','formatversion':'2'
              })
              for page in data.get('query', {}).get('pages', []):
                  found = from_page(page)
                  if found:
                      return found
              return None

          credits = {}
          failed = []
          for index, (kind, stage_id, value) in enumerate(cards, 1):
              print(f'[{index}/{len(cards)}] {stage_id}: {value}')
              try:
                  resolved = resolve_exact(value) if kind == 'item' else resolve_search(value)
                  if not resolved:
                      failed.append((stage_id, 'no Commons result'))
                      continue
                  image_url, author, license_name, source = resolved
                  req = urllib.request.Request(image_url, headers={'User-Agent': USER_AGENT})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      data = r.read()
                      content_type = (r.headers.get_content_type() or '').lower()
                  if len(data) < 2048:
                      failed.append((stage_id, 'image too small'))
                      continue
                  ext = '.png' if content_type == 'image/png' else '.webp' if content_type == 'image/webp' else '.jpg'
                  for old in OUT.glob(f'attraction_{stage_id}.*'):
                      old.unlink()
                  (OUT / f'attraction_{stage_id}{ext}').write_bytes(data)
                  credits[stage_id] = {'author': author, 'license': license_name, 'source': source}
                  time.sleep(0.08)
              except Exception as exc:
                  failed.append((stage_id, str(exc)))

          if failed:
              print('FAILED:')
              for stage, reason in failed:
                  print(stage, reason)
              raise SystemExit(f'Could not bundle {len(failed)} attraction photos')

          (ASSETS / 'attraction_photo_credits.json').write_text(
              json.dumps(credits, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(f'Bundled {len(credits)} attraction photos.')
          PY

      - name: Prefer bundled images at runtime
        shell: bash
        run: |
          test -f .bundle_photos_pending || exit 0
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:140]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          photo = 'app/src/main/java/pl/kacperikapi/mathadventure/ui/components/WikimediaPhoto.kt'
          replace(photo,
              'fun WikimediaPhoto(\n    fileName: String,',
              'fun WikimediaPhoto(\n    stageId: String,\n    fileName: String,'
          )
          replace(photo,
              '    val context = LocalContext.current\n    var image by remember(fileName, searchQuery)',
              '''    val context = LocalContext.current\n    val bundledResId = remember(stageId) {\n        context.resources.getIdentifier("attraction_$stageId", "drawable", context.packageName)\n    }\n    var image by remember(fileName, searchQuery)'''
          )
          replace(photo,
              '''    LaunchedEffect(fileName, searchQuery) {\n        val loaded = withContext(Dispatchers.IO) {\n            loadAndCacheCommonsPhoto(context.filesDir, fileName, searchQuery)\n        }\n        image = loaded?.bitmap\n        onAttribution(loaded?.attribution)\n        finished = true\n    }''',
              '''    LaunchedEffect(stageId, fileName, searchQuery, bundledResId) {\n        if (bundledResId != 0) {\n            image = null\n            onAttribution(readBundledAttribution(context, stageId))\n            finished = true\n        } else {\n            val loaded = withContext(Dispatchers.IO) {\n                loadAndCacheCommonsPhoto(context.filesDir, fileName, searchQuery)\n            }\n            image = loaded?.bitmap\n            onAttribution(loaded?.attribution)\n            finished = true\n        }\n    }'''
          )
          replace(photo,
              '''        if (fallbackRes != null) {\n            Image(''',
              '''        if (fallbackRes != null) {\n            Image('''
          )
          needle = '''        image?.let {\n            Image(\n                bitmap = it,'''
          insertion = '''        if (bundledResId != 0) {\n            Image(\n                painter = painterResource(bundledResId),\n                contentDescription = contentDescription,\n                contentScale = ContentScale.Crop,\n                modifier = Modifier.matchParentSize()\n            )\n        }\n\n        image?.let {\n            Image(\n                bitmap = it,'''
          replace(photo, needle, insertion)

          append = '''\n\nprivate fun readBundledAttribution(context: android.content.Context, stageId: String): CommonsPhotoAttribution? = runCatching {\n    val payload = context.assets.open("attraction_photo_credits.json").bufferedReader().use { it.readText() }\n    val item = JSONObject(payload).optJSONObject(stageId) ?: return@runCatching null\n    CommonsPhotoAttribution(\n        author = item.optString("author", "Wikimedia Commons contributor"),\n        license = item.optString("license", "see source"),\n        sourcePage = item.optString("source", "https://commons.wikimedia.org/")\n    )\n}.getOrNull()\n'''
          p = Path(photo)
          s = p.read_text(encoding='utf-8')
          if 'private fun readBundledAttribution' not in s:
              p.write_text(s + append, encoding='utf-8')

          story = 'app/src/main/java/pl/kacperikapi/mathadventure/ui/screens/AdventureExtras.kt'
          replace(story,
              '''                    WikimediaPhoto(\n                        fileName = attraction.photoFileName,''',
              '''                    WikimediaPhoto(\n                        stageId = stage.id,\n                        fileName = attraction.photoFileName,'''
          )

          Path('.bundle_photos_pending').unlink()
          PY

      - name: Commit bundled photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bundle attraction photos for offline play"
          git push origin HEAD:foundation-v0.5.3
