name: Build APK and AAB

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release-v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release-}"
          fi
          case "$RELEASE_TAG" in
            v*.*.*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Validate release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$RELEASE_REPO_TOKEN" || { echo "Missing RELEASE_REPO_TOKEN"; exit 1; }

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kacperkapi-release.jks"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kacperkapi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Prepare and verify APK and AAB
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$APK_PATH" || { echo "Release APK not found"; exit 1; }
          test -n "$AAB_PATH" || { echo "Release AAB not found"; exit 1; }
          cp "$APK_PATH" "dist/KacperKapi-${RELEASE_TAG}.apk"
          cp "$AAB_PATH" "dist/KacperKapi-${RELEASE_TAG}.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "dist/KacperKapi-${RELEASE_TAG}.apk"
          jarsigner -verify -verbose -certs "dist/KacperKapi-${RELEASE_TAG}.aab"

      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: KacperKapi-${{ env.RELEASE_TAG }}-GooglePlay
          path: dist/KacperKapi-${{ env.RELEASE_TAG }}.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KacperKapi-${{ env.RELEASE_TAG }}-APK
          path: dist/KacperKapi-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: przemyslawjanus2016/kacpigame-release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/KacperKapi-${RELEASE_TAG}.apk" "dist/KacperKapi-${RELEASE_TAG}.aab" --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/KacperKapi-${RELEASE_TAG}.apk" \
              "dist/KacperKapi-${RELEASE_TAG}.aab" \
              --repo "$RELEASE_REPO" \
              --target main \
              --title "Kacper & Kapi: The Game $RELEASE_TAG" \
              --generate-notes
          fi
