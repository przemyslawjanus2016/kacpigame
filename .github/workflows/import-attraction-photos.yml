name: Import attraction photos

on:
  push:
    paths:
      - ".github/workflows/import-attraction-photos.yml"

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prepared photo pack
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bd20-81f4-988e-b46fc6438071/raw?se=2026-09-20T18%3A09%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=91803517-cab0-5ad1-ba50-8529b939ad86&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T03%3A42%3A43Z&ske=2026-09-21T03%3A42%3A43Z&sks=b&skv=2026-02-06&sig=1p%2BzB5QIFo1RcOa4tD20mwEpcGYrZcaFs19/rGlGeug%3D' -o /tmp/photos.zip
          unzip -q -o /tmp/photos.zip 'app/src/main/res/drawable-nodpi/*.jpg' -d .
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'w*s*.jpg' | wc -l)" -eq 70

      - name: Commit photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/w*s*.jpg
          if git diff --cached --quiet; then
            echo "No photo changes to commit."
            exit 0
          fi
          git commit -m "Add 70 local attraction photos (1280x720)"
          git push
