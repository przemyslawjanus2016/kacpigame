name: Bundle attraction photos v2

on:
  push:
    branches:
      - foundation-v0.5.3

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: foundation-v0.5.3
          fetch-depth: 0

      - name: Check one-time marker
        id: gate
        shell: bash
        run: |
          if [ -f .bundle_photos_v2_pending ]; then
            echo "run_bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_bundle=false" >> "$GITHUB_OUTPUT"
            echo "No photo-bundle marker; nothing to do."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run_bundle == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch v0.5.3 foundation and onboarding
        if: steps.gate.outputs.run_bundle == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          extras_path = "app/src/main/java/pl/kacperikapi/mathadventure/ui/screens/AdventureExtras.kt"
          extras = Path(extras_path).read_text(encoding="utf-8")
          main_extras = subprocess.check_output(
              ["git", "show", f"origin/main:{extras_path}"], text=True
          )

          duplicate_marker = "@Composable\nfun RewardsScreen("
          settings_marker = "@Composable\nfun SettingsScreen("
          if duplicate_marker in extras:
              if settings_marker not in main_extras:
                  raise SystemExit("SettingsScreen marker not found on main")
              extras = extras[:extras.index(duplicate_marker)] + main_extras[main_extras.index(settings_marker):]
              Path(extras_path).write_text(extras, encoding="utf-8")

          world_path = "app/src/main/java/pl/kacperikapi/mathadventure/ui/screens/WorldSelectScreen.kt"
          world = Path(world_path).read_text(encoding="utf-8")
          old = '''private fun WorldGrid(
              progress: GameProgress,
              premiumUnlocked: Boolean,
              activeProfileName: String,
              onProfile: () -> Unit,
              onWorld: (Int) -> Unit,
              onPremium: () -> Unit,
              modifier: Modifier = Modifier
          )'''
          new = '''private fun WorldGrid(
              progress: GameProgress,
              premiumUnlocked: Boolean,
              onWorld: (Int) -> Unit,
              onPremium: () -> Unit,
              modifier: Modifier = Modifier
          )'''
          if old in world:
              world = world.replace(old, new, 1)
              Path(world_path).write_text(world, encoding="utf-8")

          main_path = "app/src/main/java/pl/kacperikapi/mathadventure/MainActivity.kt"
          main = Path(main_path).read_text(encoding="utf-8")

          replacements = [
              (
                  "    data object Splash : Screen\n    data object Profiles : Screen",
                  "    data object Splash : Screen\n    data object Language : Screen\n    data object Profiles : Screen"
              ),
              (
                  "BackHandler(enabled = screen != Screen.Worlds && screen != Screen.Splash && !(screen == Screen.Profiles && store.activeProfile() == null))",
                  "BackHandler(enabled = screen != Screen.Worlds && screen != Screen.Splash && screen != Screen.Language && !(screen == Screen.Profiles && store.activeProfile() == null))"
              ),
              (
                  "            Screen.Splash -> Screen.Profiles\n            Screen.Profiles -> Screen.Worlds",
                  "            Screen.Splash -> Screen.Language\n            Screen.Language -> Screen.Language\n            Screen.Profiles -> Screen.Worlds"
              ),
              (
                  "        Screen.Splash -> SplashScreen { screen = Screen.Profiles }\n        Screen.Profiles -> ProfileSelectScreen(",
                  """        Screen.Splash -> SplashScreen {
            screen = if (store.hasSavedLanguage()) Screen.Profiles else Screen.Language
        }
        Screen.Language -> LanguageSelectScreen(
            suggestedLanguage = store.loadLanguage(),
            onSelect = { tag ->
                store.saveLanguage(tag)
                onLanguageChanged()
            }
        )
        Screen.Profiles -> ProfileSelectScreen("""
              ),
          ]

          for old_text, new_text in replacements:
              if old_text in main:
                  main = main.replace(old_text, new_text, 1)
              elif new_text not in main:
                  raise SystemExit(f"MainActivity onboarding patch point not found: {old_text[:80]!r}")

          Path(main_path).write_text(main, encoding="utf-8")
          PY

      - name: Install image tooling
        if: steps.gate.outputs.run_bundle == 'true'
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and optimize open-licensed attraction photos
        if: steps.gate.outputs.run_bundle == 'true'
        run: python tools/bundle_attraction_photos.py

      - name: Set up JDK 17
        if: steps.gate.outputs.run_bundle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.gate.outputs.run_bundle == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build offline-photo version
        if: steps.gate.outputs.run_bundle == 'true'
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Commit fixed foundation and bundled photos
        if: steps.gate.outputs.run_bundle == 'true'
        shell: bash
        run: |
          rm -f .bundle_photos_v2_pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/pl/kacperikapi/mathadventure/MainActivity.kt \
                  app/src/main/java/pl/kacperikapi/mathadventure/ui/screens/AdventureExtras.kt \
                  app/src/main/java/pl/kacperikapi/mathadventure/ui/screens/WorldSelectScreen.kt \
                  app/src/main/res/drawable-nodpi/attraction_*.webp \
                  app/src/main/assets/attraction_photo_credits.json \
                  app/src/main/assets/attraction_photo_bundle_report.json \
                  .bundle_photos_v2_pending
          git commit -m "Finish v0.5.3 onboarding and offline photos"
          git pull --rebase origin foundation-v0.5.3
          git push origin HEAD:foundation-v0.5.3
